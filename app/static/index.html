<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirRoute Kraków</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🌿 AirRoute Kraków</h1>
    <div class="topbar-controls">
      <label>
        Scenario
        <select id="scenario"><option value="live">Loading…</option></select>
      </label>
      <label>
        Profile
        <select id="profile">
          <option value="standard">Standard</option>
          <option value="asthma">Asthma / Allergy</option>
          <option value="senior">Senior / Child</option>
          <option value="athlete">Athlete</option>
        </select>
      </label>
      <label class="depart-label">
        Depart
        <input id="depart" type="range" min="0" max="47" step="1" value="28" />
        <output id="departOut">14:00</output>
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="sidebar-section">
        <h2>Waypoints</h2>
        <ol id="waypoints" class="waypoints-list"></ol>
        <p class="hint" id="waypointHint">Click the map to add a start point.</p>
        <label class="optimize-label">
          <input type="checkbox" id="optimize" /> Optimize order of via points
        </label>
        <label class="optimize-label">
          <input type="checkbox" id="shadeLayer" /> Show discomfort map
        </label>
        <div class="legend" id="legend" hidden>
          <span id="legendScale" class="legend-scale"><span>comfortable</span><span class="legend-bar"></span><span>uncomfortable</span></span>
          <span id="legendHint" hidden>🔍 Zoom in to street level to see the map.</span>
        </div>
        <div class="buttons">
          <button id="findBtn" class="btn-primary" disabled>Find routes</button>
          <button id="clearBtn" class="btn-secondary" disabled>Clear</button>
        </div>
        <button id="demoBtn" class="btn-demo">▶ Load demo route</button>
      </section>

      <section class="sidebar-section" id="comparisonSection" style="display:none">
        <h2>Healthier vs fastest</h2>
        <div id="comparison"></div>
      </section>

      <section class="sidebar-section" id="cardsSection" style="display:none">
        <h2>Routes</h2>
        <div id="cards"></div>
      </section>
    </aside>

    <div id="map"></div>
  </main>

  <footer id="status"><span>📍 Click the map to add a start point.</span></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
