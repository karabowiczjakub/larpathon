<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AirRoute Kraków</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🌿 AirRoute Kraków</h1>
    <div class="topbar-controls">
      <label>
        Scenario
        <select id="scenario">
          <option value="live">Live</option>
          <option value="heatwave_2025-07-03T14">Heatwave — 3 Jul 2025, 14:00</option>
          <option value="smog_2025-01-20T17">Smog — 20 Jan 2025, 17:00</option>
        </select>
      </label>
      <label>
        Profile
        <select id="profile">
          <option value="standard">Standard</option>
          <option value="asthma">Asthma / Allergy</option>
          <option value="senior">Senior / Child</option>
          <option value="athlete">Athlete</option>
        </select>
      </label>
      <label class="depart-label">
        Depart
        <input id="depart" type="range" min="0" max="47" step="1" value="28" />
        <output id="departOut">14:00</output>
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="sidebar-section">
        <h2>Waypoints</h2>
        <ol id="waypoints" class="waypoints-list"></ol>
        <p class="hint" id="waypointHint">Click the map to add a start point.</p>
        <label class="optimize-label">
          <input type="checkbox" id="optimize" /> Optimize order
        </label>
        <div class="buttons">
          <button id="findBtn" class="btn-primary" disabled>Find routes</button>
          <button id="deepBtn" class="btn-secondary" disabled>Deep search ✨</button>
        </div>
        <button id="demoBtn" class="btn-demo">▶ Load demo route</button>
      </section>

      <section class="sidebar-section" id="cardsSection" style="display:none">
        <h2>Routes</h2>
        <div id="cards"></div>
      </section>

      <section class="sidebar-section" id="paretoSection" style="display:none">
        <h2>Pareto front</h2>
        <div style="position: relative; height: 200px; width: 100%;">
          <canvas id="pareto"></canvas>
        </div>
      </section>
    </aside>

    <div id="map"></div>
  </main>

  <footer id="status"><span>📍 Click the map to add a start point.</span></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js"></script>
</body>
</html>
